let paperName="",questions=[],idx=0,score=0,selected=[];
function init(){
 const grid=document.getElementById("paperGrid");
 Object.entries(DATA).forEach(([name,qs])=>{
  const div=document.createElement("div");div.className="card";
  div.innerHTML=`<h2>${name}</h2><div class="count">${qs.length} MCQs</div><button class="primary">Start Practice</button>`;
  div.querySelector("button").onclick=()=>start(name);grid.appendChild(div);
 });
}
function start(name){paperName=name;questions=DATA[name];idx=0;score=0;selected=Array(questions.length).fill(null);show("quiz");document.getElementById("paperTitle").textContent=name;render();}
function render(){
 const q=questions[idx],answered=selected[idx]!==null;
 document.getElementById("qno").textContent=`Question ${idx+1} of ${questions.length}`;
 document.getElementById("question").textContent=q.q;
 document.getElementById("bar").style.width=((idx+1)/questions.length*100)+"%";
 const box=document.getElementById("options");box.innerHTML="";
 q.options.forEach((opt,i)=>{
  const b=document.createElement("button");b.className="option";b.textContent=String.fromCharCode(65+i)+". "+opt;
  if(answered){b.classList.add("disabled");if(q.answer===i)b.classList.add("correct");if(selected[idx]===i&&i!==q.answer)b.classList.add("wrong")}
  else b.onclick=()=>answer(i);box.appendChild(b);
 });
 const fb=document.getElementById("feedback");fb.className="";fb.innerHTML="";
 if(answered){
  if(q.answer===null){fb.className="feedback bad";fb.textContent="The source answer key indicates that there is no correct option."}
  else if(selected[idx]===q.answer){fb.className="feedback good";fb.textContent="✓ Correct!"}
  else{fb.className="feedback bad";fb.textContent="✗ Wrong. Correct answer: "+String.fromCharCode(65+q.answer)+". "+q.options[q.answer]}
 }
 document.getElementById("prev").disabled=idx===0;document.getElementById("next").textContent=idx===questions.length-1?"Finish":"Next";
}
function answer(i){selected[idx]=i;if(questions[idx].answer!==null&&i===questions[idx].answer)score++;render()}
function nextQ(){if(idx<questions.length-1){idx++;render()}else showResult()}
function prevQ(){if(idx>0){idx--;render()}}
function restart(){start(paperName)}
function showResult(){show("result");document.getElementById("resultPaper").textContent=paperName;document.getElementById("scoreText").textContent=`${score} / ${questions.length}`;document.getElementById("scoreDetail").textContent=`Score: ${(score/questions.length*100).toFixed(1)}%`}
function goHome(){show("home")}
function show(id){["home","quiz","result"].forEach(x=>document.getElementById(x).classList.toggle("hide",x!==id))}
init();
</script>
